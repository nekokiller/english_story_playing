<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文童話故事播放</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">English Story Time</p>
    <h1 id="title">載入中…</h1>
    <p id="title-zh" class="title-zh"></p>
    <ul id="cast" class="cast" aria-label="角色"></ul>
  </header>

  <nav class="controls" aria-label="播放控制">
    <button id="btn-prev" class="ctl" type="button" title="上一句（↑）" aria-label="上一句">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button id="btn-play" class="ctl ctl-main" type="button" title="開始播放 / 暫停（空白鍵）">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
      <span id="play-label">開始播放</span>
    </button>
    <button id="btn-next" class="ctl" type="button" title="下一句（↓）" aria-label="下一句">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <div class="progress-wrap">
      <span id="progress-text" class="progress-text">0 / 0</span>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
    </div>
    <label class="speed">
      <span>速度</span>
      <select id="speed">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
      </select>
    </label>
  </nav>

  <main>
    <p class="hint">點任何一句台詞，就會從那一句開始播放。</p>
    <div id="script" class="script"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
